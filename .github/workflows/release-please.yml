name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # No branch protection / required checks on this repo (that needs GitHub
      # Pro on a private repo), so the safety gate lives here instead: check
      # out the release PR's branch, run each package's own check/test, and
      # only merge if they're green. A failing step skips every step after it
      # (default `if` implies the job hasn't failed yet), so a red run simply
      # leaves the PR open for a human instead of merging a broken release.
      - name: Resolve release PR branch/number
        if: ${{ steps.release.outputs.prs_created }}
        id: pr
        run: |
          echo "branch=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.headBranchName')" >> "$GITHUB_OUTPUT"
          echo "number=$(echo '${{ steps.release.outputs.pr }}' | jq -r '.number')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.prs_created }}
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.prs_created }}
        with:
          node-version: 24

      - name: slice-flow — install, typecheck, test
        if: ${{ steps.release.outputs.prs_created }}
        working-directory: slice-flow
        run: |
          npm install
          npm run check
          npm test

      - name: simple-flow — install, test
        if: ${{ steps.release.outputs.prs_created }}
        working-directory: simple-flow
        run: |
          npm install
          npm test

      - name: Merge release PR
        if: ${{ steps.release.outputs.prs_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.pr.outputs.number }} --squash

      # release-please normally tags + publishes the GitHub Release on the NEXT
      # run, triggered by the merge landing on main — but a push made with the
      # default GITHUB_TOKEN never triggers another workflow run (GitHub's
      # anti-loop rule), so that second pass would never happen on its own.
      # Rather than adding a PAT/GitHub App just to re-trigger ourselves,
      # simply invoke the action again right here: it re-reads the repo's
      # current state from the API regardless of which job called it, so
      # calling it a second time immediately after the merge does exactly what
      # a real second run would have done — tag and publish — with no extra
      # credential to create or rotate.
      - name: Tag and publish the release now that the PR is merged
        if: ${{ steps.release.outputs.prs_created }}
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
